<svg width="936" height="336" viewBox="0 0 936 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cycle-title cycle-desc"><title id="cycle-title">The signal cycle</title><desc id="cycle-desc">Four phases run in a fixed cycle. Each green ends in a yellow of 4 seconds and an all-red of 2 seconds. An arrow phase runs only if a right turn waits, and a through phase rests in green if nothing else waits.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6472"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3257e8"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#17803f"/></marker></defs><rect width="100%" height="100%" fill="#f1f3f8"/><circle cx="56" cy="178" r="6" fill="#151922"/><path d="M62 178 H92" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M224 178 H316" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="230.0" y="160" width="84" height="12" rx="2" fill="#f1f3f8"/><text x="272" y="169" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">IF RIGHT WAITS</text><path d="M448 178 H540" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="454.0" y="160" width="84" height="12" rx="2" fill="#f1f3f8"/><text x="496" y="169" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GREEN ENDS</text><path d="M672 178 H764" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="678.0" y="160" width="84" height="12" rx="2" fill="#f1f3f8"/><text x="720" y="169" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">IF RIGHT WAITS</text><path d="M832 216 V228 a8 8 0 0 1 -8 8 H168 a8 8 0 0 1 -8 -8 V220" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="464.0" y="218" width="64" height="12" rx="2" fill="#f1f3f8"/><text x="496" y="227" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GREEN ENDS</text><path d="M136 140 V116 a8 8 0 0 1 8 -8 H168 a8 8 0 0 1 8 8 V136" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="132.0" y="90" width="80" height="12" rx="2" fill="#f1f3f8"/><text x="172" y="99" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REST IF EMPTY</text><path d="M584 140 V116 a8 8 0 0 1 8 -8 H616 a8 8 0 0 1 8 8 V136" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="580.0" y="90" width="80" height="12" rx="2" fill="#f1f3f8"/><text x="620" y="99" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REST IF EMPTY</text><rect x="96" y="140" width="128" height="76" rx="6" fill="#f1f3f8"/><rect x="96" y="140" width="128" height="76" rx="6" fill="#3257e8" fill-opacity="0.08" stroke="#3257e8" stroke-width="1"/><text x="160.0" y="161" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">T13</text><text x="160.0" y="179" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">through and left</text><text x="160.0" y="193" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">roads 1 and 3</text><text x="160.0" y="207" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">5 to 60 s</text><rect x="320" y="140" width="128" height="76" rx="6" fill="#f1f3f8"/><rect x="320" y="140" width="128" height="76" rx="6" fill="#ffffff" stroke="#151922" stroke-width="1"/><text x="384.0" y="161" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">R24</text><text x="384.0" y="179" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">right-turn arrows</text><text x="384.0" y="193" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">roads 2 and 4</text><text x="384.0" y="207" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">up to 15 s</text><rect x="544" y="140" width="128" height="76" rx="6" fill="#f1f3f8"/><rect x="544" y="140" width="128" height="76" rx="6" fill="#ffffff" stroke="#151922" stroke-width="1"/><text x="608.0" y="161" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">T24</text><text x="608.0" y="179" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">through and left</text><text x="608.0" y="193" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">roads 2 and 4</text><text x="608.0" y="207" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">5 to 60 s</text><rect x="768" y="140" width="128" height="76" rx="6" fill="#f1f3f8"/><rect x="768" y="140" width="128" height="76" rx="6" fill="#ffffff" stroke="#151922" stroke-width="1"/><text x="832.0" y="161" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">R13</text><text x="832.0" y="179" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">right-turn arrows</text><text x="832.0" y="193" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">roads 1 and 3</text><text x="832.0" y="207" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">up to 15 s</text><line x1="40" y1="280" x2="896" y2="280" stroke="#151922" stroke-opacity="0.12" stroke-width="0.8"/><text x="40" y="296" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="292" x2="136" y2="292" stroke="#5b6472" stroke-width="1.2"/><text x="144" y="296" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">transition (each ends with yellow 4 s, then all-red 2 s)</text><rect x="452" y="286" width="24" height="12" rx="3" fill="#3257e8" fill-opacity="0.08" stroke="#3257e8" stroke-width="1"/><text x="484" y="296" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">start phase</text></svg>
