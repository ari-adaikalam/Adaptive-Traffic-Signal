<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency preemption</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f1f3f8;
      --color-ink: #151922;
      --color-muted: #5b6472;
      --color-accent: #3257e8;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Emergency preemption</h1>
    <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emergency-title emergency-desc"><title id="emergency-title">Emergency preemption</title><desc id="emergency-desc">An emergency vehicle sends pause with its road. The controller holds the green if its phase is already running. Otherwise it keeps the minimum green, runs a yellow of 4 seconds and an all-red of 2 seconds, then opens the phase and holds it. After resume, a short green follows and the normal cycle goes on.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6472"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3257e8"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#17803f"/></marker></defs><rect width="100%" height="100%" fill="#f1f3f8"/><line x1="180" y1="88" x2="180" y2="496" stroke="rgba(21,25,34,0.22)" stroke-width="1" stroke-dasharray="4,3"/><line x1="480" y1="88" x2="480" y2="496" stroke="rgba(21,25,34,0.22)" stroke-width="1" stroke-dasharray="4,3"/><line x1="780" y1="88" x2="780" y2="496" stroke="rgba(21,25,34,0.22)" stroke-width="1" stroke-dasharray="4,3"/><rect x="300" y="176" width="540" height="208" rx="4" fill="rgba(21,25,34,0.02)" stroke="rgba(21,25,34,0.22)" stroke-width="1"/><rect x="300" y="176" width="40" height="16" rx="2" fill="#f1f3f8" stroke="rgba(21,25,34,0.22)" stroke-width="1"/><text x="320" y="188" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text><text x="312" y="208" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">[its phase is already green]</text><line x1="308" y1="268" x2="832" y2="268" stroke="rgba(21,25,34,0.20)" stroke-width="1" stroke-dasharray="4,3"/><text x="312" y="288" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">[another phase is running]</text><path d="M180 136 H476" fill="none" stroke="#3257e8" stroke-width="1.2" marker-end="url(#arrow-accent)"/><rect x="272.0" y="118" width="116" height="12" rx="2" fill="#f1f3f8"/><text x="330.0" y="127" fill="#3257e8" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PAUSE(VEHICLE, ROAD)</text><path d="M480 240 H776" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="588.0" y="222" width="84" height="12" rx="2" fill="#f1f3f8"/><text x="630.0" y="231" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">HOLD THE GREEN</text><path d="M480 332 H776" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="534.0" y="314" width="192" height="12" rx="2" fill="#f1f3f8"/><text x="630.0" y="323" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">MIN GREEN, YELLOW 4 S, ALL-RED 2 S</text><path d="M480 364 H776" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="564.0" y="346" width="132" height="12" rx="2" fill="#f1f3f8"/><text x="630.0" y="355" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">OPEN ITS PHASE AND HOLD</text><path d="M180 432 H476" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="286.0" y="414" width="88" height="12" rx="2" fill="#f1f3f8"/><text x="330.0" y="423" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">RESUME(VEHICLE)</text><path d="M480 472 H776" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="534.0" y="454" width="192" height="12" rx="2" fill="#f1f3f8"/><text x="630.0" y="463" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SHORT GREEN, THEN THE NORMAL CYCLE</text><rect x="96" y="40" width="168" height="48" rx="6" fill="#f1f3f8"/><rect x="96" y="40" width="168" height="48" rx="6" fill="rgba(50,87,232,0.08)" stroke="#3257e8" stroke-width="1"/><text x="180.0" y="68" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Emergency vehicle</text><rect x="396" y="40" width="168" height="48" rx="6" fill="#f1f3f8"/><rect x="396" y="40" width="168" height="48" rx="6" fill="#ffffff" stroke="#151922" stroke-width="1"/><text x="480.0" y="68" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Controller</text><rect x="696" y="40" width="168" height="48" rx="6" fill="#f1f3f8"/><rect x="696" y="40" width="168" height="48" rx="6" fill="#ffffff" stroke="#151922" stroke-width="1"/><text x="780.0" y="68" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Signals</text><line x1="40" y1="504" x2="920" y2="504" stroke="rgba(21,25,34,0.12)" stroke-width="0.8"/><text x="40" y="520" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="516" x2="136" y2="516" stroke="#5b6472" stroke-width="1.2"/><text x="144" y="520" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">message</text><line x1="208" y1="516" x2="232" y2="516" stroke="#3257e8" stroke-width="1.2"/><text x="240" y="520" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">emergency request</text><rect x="356" y="510" width="24" height="12" rx="3" fill="rgba(50,87,232,0.08)" stroke="#3257e8" stroke-width="1"/><text x="388" y="520" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">the vehicle</text></svg>
  </div>
</body>
</html>
