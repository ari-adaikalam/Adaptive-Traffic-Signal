<!DOCTYPE html>

  <title>The signal cycle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f1f3f8;
      --color-ink: #151922;
      --color-muted: #5b6472;
      --color-accent: #3257e8;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>

ddle">roads 1 and 3</text><text x="832.0" y="207" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">up to 15 s</text><line x1="40" y1="280" x2="896" y2="280" stroke="rgba(21,25,34,0.12)" stroke-width="0.8"/><text x="40" y="296" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="292" x2="136" y2="292" stroke="#5b6472" stroke-width="1.2"/><text x="144" y="296" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">transition (each ends with yellow 4 s, then all-red 2 s)</text><rect x="452" y="286" width="24" height="12" rx="3" fill="rgba(50,87,232,0.08)" stroke="#3257e8" stroke-width="1"/><text x="484" y="296" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">start phase</text></svg>
