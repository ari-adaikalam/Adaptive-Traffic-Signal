<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emergency-title emergency-desc"><title id="emergency-title">Emergency preemption</title><desc id="emergency-desc">An emergency vehicle sends pause with its road. The controller holds the green if its phase is already running. Otherwise it keeps the minimum green, runs a yellow of 4 seconds and an all-red of 2 seconds, then opens the phase and holds it. After resume, a short green follows and the normal cycle goes on.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a3adc2"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6f8cff"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4cc38a"/></marker></defs><rect width="100%" height="100%" fill="#121826"/><line x1="180" y1="88" x2="180" y2="496" stroke="#e8ecf5" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4,3"/><line x1="480" y1="88" x2="480" y2="496" stroke="#e8ecf5" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4,3"/><line x1="780" y1="88" x2="780" y2="496" stroke="#e8ecf5" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4,3"/><rect x="300" y="176" width="540" height="208" rx="4" fill="#e8ecf5" fill-opacity="0.04" stroke="#e8ecf5" stroke-opacity="0.22" stroke-width="1"/><rect x="300" y="176" width="40" height="16" rx="2" fill="#121826" stroke="#e8ecf5" stroke-opacity="0.22" stroke-width="1"/><text x="320" y="188" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text><text x="312" y="208" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">[its phase is already green]</text><line x1="308" y1="268" x2="832" y2="268" stroke="#e8ecf5" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/><text x="312" y="288" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">[another phase is running]</text><path d="M180 136 H476" fill="none" stroke="#6f8cff" stroke-width="1.2" marker-end="url(#arrow-accent)"/><rect x="272.0" y="118" width="116" height="12" rx="2" fill="#121826"/><text x="330.0" y="127" fill="#6f8cff" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PAUSE(VEHICLE, ROAD)</text><path d="M480 240 H776" fill="none" stroke="#a3adc2" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="588.0" y="222" width="84" height="12" rx="2" fill="#121826"/><text x="630.0" y="231" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">HOLD THE GREEN</text><path d="M480 332 H776" fill="none" stroke="#a3adc2" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="534.0" y="314" width="192" height="12" rx="2" fill="#121826"/><text x="630.0" y="323" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">MIN GREEN, YELLOW 4 S, ALL-RED 2 S</text><path d="M480 364 H776" fill="none" stroke="#a3adc2" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="564.0" y="346" width="132" height="12" rx="2" fill="#121826"/><text x="630.0" y="355" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">OPEN ITS PHASE AND HOLD</text><path d="M180 432 H476" fill="none" stroke="#a3adc2" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="286.0" y="414" width="88" height="12" rx="2" fill="#121826"/><text x="330.0" y="423" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">RESUME(VEHICLE)</text><path d="M480 472 H776" fill="none" stroke="#a3adc2" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="534.0" y="454" width="192" height="12" rx="2" fill="#121826"/><text x="630.0" y="463" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SHORT GREEN, THEN THE NORMAL CYCLE</text><rect x="96" y="40" width="168" height="48" rx="6" fill="#121826"/><rect x="96" y="40" width="168" height="48" rx="6" fill="#6f8cff" fill-opacity="0.12" stroke="#6f8cff" stroke-width="1"/><text x="180.0" y="68" fill="#e8ecf5" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Emergency vehicle</text><rect x="396" y="40" width="168" height="48" rx="6" fill="#121826"/><rect x="396" y="40" width="168" height="48" rx="6" fill="#1b2233" stroke="#e8ecf5" stroke-width="1"/><text x="480.0" y="68" fill="#e8ecf5" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Controller</text><rect x="696" y="40" width="168" height="48" rx="6" fill="#121826"/><rect x="696" y="40" width="168" height="48" rx="6" fill="#1b2233" stroke="#e8ecf5" stroke-width="1"/><text x="780.0" y="68" fill="#e8ecf5" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Signals</text><line x1="40" y1="504" x2="920" y2="504" stroke="#e8ecf5" stroke-opacity="0.12" stroke-width="0.8"/><text x="40" y="520" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="516" x2="136" y2="516" stroke="#a3adc2" stroke-width="1.2"/><text x="144" y="520" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">message</text><line x1="208" y1="516" x2="232" y2="516" stroke="#6f8cff" stroke-width="1.2"/><text x="240" y="520" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">emergency request</text><rect x="356" y="510" width="24" height="12" rx="3" fill="#6f8cff" fill-opacity="0.12" stroke="#6f8cff" stroke-width="1"/><text x="388" y="520" fill="#a3adc2" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">the vehicle</text></svg>
