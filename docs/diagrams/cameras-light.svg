<svg width="880" height="396" viewBox="0 0 880 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cameras-title cameras-desc"><title id="cameras-title">Camera coverage on one road</title><desc id="cameras-desc">Two cameras stand 20 m and 60 m from the stop line. Each owns 40 m of the 80 m counted zone.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6472"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3257e8"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#17803f"/></marker></defs><rect width="100%" height="100%" fill="#f1f3f8"/><line x1="104" y1="152" x2="776" y2="152" stroke="#151922" stroke-opacity="0.25" stroke-width="1"/><line x1="120" y1="148" x2="120" y2="156" stroke="#5b6472" stroke-width="1"/><text x="120" y="172" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">0 M</text><line x1="280" y1="148" x2="280" y2="156" stroke="#5b6472" stroke-width="1"/><text x="280" y="172" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">20 M</text><line x1="440" y1="148" x2="440" y2="156" stroke="#5b6472" stroke-width="1"/><text x="440" y="172" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">40 M</text><line x1="600" y1="148" x2="600" y2="156" stroke="#5b6472" stroke-width="1"/><text x="600" y="172" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">60 M</text><line x1="760" y1="148" x2="760" y2="156" stroke="#5b6472" stroke-width="1"/><text x="760" y="172" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">80 M</text><text x="120" y="188" fill="#8a92a0" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">stop line</text><line x1="280" y1="92" x2="280" y2="144" stroke="#151922" stroke-opacity="0.25" stroke-width="1"/><circle cx="280" cy="152" r="6" fill="#3257e8"/><text x="280" y="60" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Camera 1</text><text x="280" y="76" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">10 m up, 130 degree lens</text><line x1="600" y1="92" x2="600" y2="144" stroke="#151922" stroke-opacity="0.25" stroke-width="1"/><circle cx="600" cy="152" r="6" fill="#3257e8"/><text x="600" y="60" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Camera 2</text><text x="600" y="76" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">10 m up, 130 degree lens</text><rect x="124" y="212" width="312" height="28" fill="#f1f3f8"/><rect x="124" y="212" width="312" height="28" rx="4" fill="#5b6472" fill-opacity="0.15" stroke="#5b6472" stroke-width="1"/><text x="280.0" y="230" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">Camera 1 owns 0 to 40 m</text><rect x="444" y="212" width="312" height="28" fill="#f1f3f8"/><rect x="444" y="212" width="312" height="28" rx="4" fill="#5b6472" fill-opacity="0.08" stroke="#5b6472" stroke-width="1"/><text x="600.0" y="230" fill="#5b6472" font-size="9" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">Camera 2 owns 40 to 80 m</text><path d="M124 268 V276 H756 V268" fill="none" stroke="#151922" stroke-width="1.2"/><text x="440.0" y="296" fill="#151922" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Counted zone, 80 m</text><line x1="40" y1="340" x2="840" y2="340" stroke="#151922" stroke-opacity="0.12" stroke-width="0.8"/><text x="40" y="356" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><circle cx="124" cy="352" r="6" fill="#3257e8"/><text x="144" y="356" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">camera</text><rect x="204" y="346" width="24" height="12" rx="3" fill="#5b6472" fill-opacity="0.15" stroke="#5b6472" stroke-width="1"/><text x="236" y="356" fill="#5b6472" font-size="8" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.04em">stretch a camera owns</text></svg>
